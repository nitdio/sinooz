<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sinooz - Product</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="header"></div>

    <main class="product-page">

        <div class="breadcrumb" id="breadcrumb">
            <a href="home.html">Home</a>
        </div>

        <div class="product-top">

            <div class="product-gallery">
                <div class="gallery-main-wrap">
                    <button class="gallery-arrow gallery-prev">&#10094;</button>
                    <div class="gallery-main"></div>
                    <button class="gallery-arrow gallery-next">&#10095;</button>
                </div>
                <div class="gallery-thumbs">
                    <div class="thumb thumb-active"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                </div>
            </div>

            <div class="product-info">
                <h1 class="product-title" id="product-title"></h1>

                <div class="product-rating">
                    <span class="stars" id="product-stars"></span>
                    <a href="#" class="review-count" id="product-reviews"></a>
                </div>

                <ul class="product-highlights" id="product-highlights"></ul>

                <p class="select-label">Select Size:</p>
                <div class="option-group" id="size-options"></div>

                <p class="select-label">Select Edition:</p>
                <div class="option-group" id="edition-options"></div>

                <div class="product-price">
                    <span class="price-current" id="price-current"></span>
                    <span class="price-was" id="price-was"></span>
                </div>

            </div>

        </div>

        <div class="product-accordion">

            <div class="accordion-item">
                <button class="accordion-header">
                    <span>Features</span>
                    <span class="accordion-icon">+</span>
                </button>
                <div class="accordion-body">
                    <ul id="acc-features"></ul>
                </div>
            </div>

            <div class="accordion-item">
                <button class="accordion-header">
                    <span>Materials</span>
                    <span class="accordion-icon">+</span>
                </button>
                <div class="accordion-body">
                    <p id="acc-materials"></p>
                </div>
            </div>

            <div class="accordion-item">
                <button class="accordion-header">
                    <span>Measurements</span>
                    <span class="accordion-icon">+</span>
                </button>
                <div class="accordion-body">
                    <p id="acc-measurements"></p>
                </div>
            </div>

            <div class="accordion-item">
                <button class="accordion-header">
                    <span>Care Instructions</span>
                    <span class="accordion-icon">+</span>
                </button>
                <div class="accordion-body">
                    <p id="acc-care"></p>
                </div>
            </div>

            <div class="accordion-item">
                <button class="accordion-header">
                    <span>Shipping Information</span>
                    <span class="accordion-icon">+</span>
                </button>
                <div class="accordion-body">
                    <p id="acc-shipping"></p>
                </div>
            </div>

        </div>

    </main>

    <div id="footer"></div>

    <script src="products-data.js"></script>
    <script src="header.js"></script>
    <script src="footer.js"></script>
    <script src="product.js"></script>

</body>

</html>
